<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Az oldal nem található | sKlima</title>
  <meta name="robots" content="noindex" />
  <!-- GitHub Pages serves this file for any path, so every URL here is absolute. -->
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <style>
    body {
      min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: var(--space-6) var(--space-4);
      background: linear-gradient(180deg, #f0f9ff 0%, #e0f2fe 60%, #ffffff 100%); text-align: center;
    }
    .code {
      font-family: var(--font-display); font-weight: 700; font-size: clamp(5rem, 20vw, 9rem); line-height: 1; letter-spacing: -0.05em;
      background: linear-gradient(180deg, rgba(2, 132, 199, 0.82) 0%, rgba(2, 132, 199, 0.3) 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    h1 { font-family: var(--font-display); font-size: var(--text-xl); color: #0b2238; margin-block: var(--space-4) var(--space-2); }
    p { color: var(--color-text-muted); max-width: 28rem; margin-inline: auto; }
    .actions { display: flex; flex-wrap: wrap; gap: var(--space-3); justify-content: center; margin-top: var(--space-8); }
    .btn {
      display: inline-flex; align-items: center; min-height: 50px; padding: 0.95rem 1.8rem; border-radius: var(--radius-full);
      font-weight: 700; box-shadow: var(--shadow-md);
    }
    .btn-primary { background: var(--color-primary); color: var(--color-text-inverse); }
    .btn-primary:hover { background: var(--color-primary-hover); }
    .btn-secondary { background: var(--color-surface); color: var(--color-primary); border: 2px solid color-mix(in srgb, var(--color-primary) 25%, transparent); }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1>Ez az oldal nem található</h1>
    <p>Lehet, hogy elírás van a címben, vagy az oldal már nem létezik.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Vissza a főoldalra</a>
      <a class="btn btn-secondary" href="tel:+36307303248">Hívás: +36 30 730 3248</a>
    </div>
  </main>
</body>
</html>
